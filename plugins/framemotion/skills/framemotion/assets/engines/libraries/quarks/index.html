<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>three.quarks engine</title>
<style>html, body { margin: 0; background: transparent; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","quarks.core":"../../node_modules/quarks.core/dist/quarks.core.esm.js","three.quarks":"../../node_modules/three.quarks/dist/three.quarks.esm.js"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
// three.quarks (MIT, Alchemist0823) on the FrameMotion clock, used unchanged from node_modules; this
// page is ours. three.quarks is a simulation: each update moves particles from where they were. So
// nothing runs on its own: seek(t) steps the whole effect from the start in fixed steps (a backwards
// seek starts it over) with Math.random replaced by a generator seeded from `seed`, and renders once.
// The same seed and t always give the same picture. Sprites are drawn here, so no file is loaded.
// Settings (JSON in ?params): preset (fire, smoke, sparks, magic), seed, steps (per frame), background
// (a CSS colour, or "transparent" for an overlay), scale (effect size, 1 = about a third of the frame
// height), at ([x, y] in frame fractions from the centre, -0.5..0.5), move ("orbit": the camera circles
// and closes in, so the depth shows; "still"), camera (distance), stage (a dark floor and stone pillars
// lit by the effect, which pass in front of it as the camera moves; on by default unless transparent),
// prewarm (seconds simulated before frame 0, default 2; the sparks burst always starts at frame 0).
import * as THREE from 'three';
import * as Q from 'three.quarks';
import {defineEngine, createRng} from '../../kit/engine-kit.mjs';
import {readParams, withSeededRandom} from '../library-kit.mjs';
import {makePresets} from './presets.mjs';

const params = readParams();
const {width = 540, height = 960, preset = 'fire', seed = 11, background = '#0d0f14', move = 'orbit'} = params;
const fps = params.fps ?? 30, steps = params.steps ?? 2, duration = params.duration ?? 4;
const k = Math.min(3, Math.max(0.3, Number(params.scale ?? 1)));
const [ax, ay] = Array.isArray(params.at) ? params.at.map(Number) : [0, 0];
const stage = params.stage ?? background !== 'transparent';
const distance = params.camera ?? 70;
if (!['orbit', 'still'].includes(move)) throw new Error(`unknown move "${move}" (orbit, still)`);
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({canvas: view, antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(width, height, false);
if (background === 'transparent') renderer.setClearColor(0x000000, 0); else renderer.setClearColor(new THREE.Color(background), 1);
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
// `at` moves the effect in the frame: the offset is in world units at the effect's distance
const viewH = 2 * distance * Math.tan(THREE.MathUtils.degToRad(20)), viewW = viewH * width / height;
const offset = new THREE.Vector3(ax * viewW, ay * viewH, 0);

// sprites: a soft dot, and a smoke puff of seeded blobs lit from above (lighter top, darker underside)
function sprite(size, draw) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  draw(cv.getContext('2d'));
  const texture = new THREE.CanvasTexture(cv);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
const dot = sprite(128, g => {
  const rad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rad.addColorStop(0, 'rgba(255,255,255,1)'); rad.addColorStop(0.35, 'rgba(255,255,255,0.6)'); rad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rad; g.fillRect(0, 0, 128, 128);
});
const puff = sprite(256, g => {
  const prng = createRng(7);
  for (let i = 0; i < 34; i++) {
    const a = prng.next() * Math.PI * 2, d = Math.sqrt(prng.next()) * 62, x = 128 + Math.cos(a) * d, y = 128 + Math.sin(a) * d, r = 26 + prng.next() * 40;
    const shade = Math.round(150 + 105 * Math.min(1, Math.max(0, (180 - y) / 120)));   // lit from above
    const rg = g.createRadialGradient(x - r * 0.25, y - r * 0.3, 0, x, y, r);
    rg.addColorStop(0, `rgba(${shade},${shade},${shade},0.36)`); rg.addColorStop(0.6, `rgba(${shade - 40},${shade - 40},${shade - 38},0.2)`); rg.addColorStop(1, 'rgba(90,90,95,0)');
    g.fillStyle = rg; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
});
const PRESETS = makePresets(Q, THREE, {dot, puff});
// quarks.core makes its 100 shared noise generators (with Math.random) when the first Noise behaviour is
// built, once per page. Build them here from a fixed seed, so they are the same on every page and never
// take numbers from the effect's own seeded stream (a restart would otherwise draw different particles).
withSeededRandom(1, () => new Q.Noise(new Q.ConstantValue(1), new Q.ConstantValue(1)));
if (!PRESETS[preset]) throw new Error(`unknown preset "${preset}" (known: ${Object.keys(PRESETS).join(', ')})`);
const effect = PRESETS[preset];

// the stage: a floor under the effect and four pillars around it, lit by a flickering light at the effect
const floorY = -21 * k;
let light = null;
function buildStage(scene) {
  scene.add(new THREE.HemisphereLight(0x8090b0, 0x2a2018, 0.9));
  light = new THREE.PointLight(effect.light, 0, 0, 1.4);
  light.position.set(0, floorY + 6 * k, 0).add(offset);
  scene.add(light);
  const stone = new THREE.MeshStandardMaterial({color: 0x3a342e, roughness: 0.92});
  const floor = new THREE.Mesh(new THREE.CircleGeometry(90, 64), new THREE.MeshStandardMaterial({color: 0x2a2420, roughness: 1}));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, floorY, 0).add(offset);
  scene.add(floor);
  for (const [x, z, h, r] of [[4.5, 12, 13, 2.4], [20, -12, 42, 3], [-24, -22, 38, 3.2], [-30, 14, 30, 2.4]]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9 * k, r * k, h * k, 18), stone);
    pillar.position.set(x * k, floorY + h * k / 2, z * k).add(offset);
    scene.add(pillar);
  }
}
const flicker = t => effect.glow * (1 + 0.16 * Math.sin(t * 17.3) + 0.1 * Math.sin(t * 29.1 + 1.3) + 0.06 * Math.sin(t * 7.7));

let scene = null, batch = null, done = -1;
const dt = 1 / (fps * steps);
function seeded(fn) {
  const original = Math.random;
  Math.random = rng.next;
  try { return fn(); } finally { Math.random = original; }
}
let rng = createRng(seed >>> 0);
function restart() {
  if (batch) { batch.dispose?.(); }
  rng = createRng(seed >>> 0);
  scene = new THREE.Scene();
  batch = new Q.BatchedRenderer();
  scene.add(batch);
  if (stage) buildStage(scene);
  seeded(() => {
    for (const fx of effect.layers(k)) {
      const system = new Q.ParticleSystem(fx.system);
      for (const b of fx.behaviours) system.addBehavior(b);
      const e = system.emitter;
      e.position.set(...fx.at).add(offset);
      e.rotation.x = -Math.PI / 2;   // emitters point along +Z; ours point up, and flat rings lie on the floor
      scene.add(e);
      batch.addSystem(system);
    }
  });
  done = -1;
}
function step() {
  done += 1;
  if (done > 0) seeded(() => { scene.updateMatrixWorld(true); batch.update(dt); });
}
function place(t) {
  // orbit: a 50 degree arc around the effect while closing in by a fifth, eased so it starts and ends gently
  const u = move === 'orbit' ? 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, t / duration)) : 0.5;
  const angle = move === 'orbit' ? THREE.MathUtils.degToRad(-25 + 50 * u) : 0, d = move === 'orbit' ? distance * (1.08 - 0.2 * u) : distance;
  const look = new THREE.Vector3(0, -4 * k, 0).add(offset);
  camera.position.set(look.x + Math.sin(angle) * d, look.y + (stage ? 9 : 0) * k, look.z + Math.cos(angle) * d);
  camera.lookAt(look);
}
// looping effects start already running (prewarm seconds simulated before frame 0), so no frame is empty
const prewarm = effect.loops ? (params.prewarm ?? 2) : 0;
async function seek(t) {
  const target = Math.round((t + prewarm) * fps * steps);
  if (scene === null || target < done) restart();
  while (done < target) step();
  if (light) light.intensity = 600 * k * k * flicker(t);
  place(t);
  scene.updateMatrixWorld(true);
  renderer.render(scene, camera);
}
await seek(0);
const engine = defineEngine({id: 'quarks-3d-effects', width, height, fps, duration, seek});
window.__framemotion = {engine, canvas: view, ready: true};
</script>
</body>

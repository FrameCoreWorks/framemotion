<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>css-doodle engine</title>
<style>
  html, body { margin: 0; background: #0d0f14; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #0d0f14; display: grid; place-items: center; }
</style>
<script src="../../node_modules/css-doodle/css-doodle.min.js"></script>
</head>
<body>
<div id="stage"></div>
<script type="module">
// css-doodle (MIT, Yuan Chuan) on the FrameMotion clock, used unchanged from node_modules; this page
// is ours. A doodle is a grid of cells styled by CSS rules with random values; `seed` fixes those
// values. Motion must be CSS animations or transitions: seek(t) pauses every animation in the page,
// shadow trees included, and sets its time to t. Doodle functions that load fonts or files from the
// web (@import, font loading) cannot work here: the renderer blocks them and reports the request.
import {defineEngine} from '../../kit/engine-kit.mjs';
import {readParams, frames} from '../library-kit.mjs';
import {DOODLES} from './doodles.mjs';

const params = readParams();
const {width = 540, height = 960, doodle = 'tiles', seed = 2026} = params;
const rules = (params.rules || DOODLES[doodle])?.replaceAll('var(--w)', `${width}px`).replaceAll('var(--h)', `${height}px`)
  .replaceAll('var(--k)', String(Math.min(width, height) / 540));
if (!rules) throw new Error(`unknown doodle "${doodle}" (known: ${Object.keys(DOODLES).join(', ')})`);
const stage = document.getElementById('stage');
Object.assign(stage.style, {width: `${width}px`, height: `${height}px`});
const el = document.createElement('css-doodle');
el.setAttribute('seed', String(seed));
el.textContent = rules;
stage.appendChild(el);
await customElements.whenDefined('css-doodle');
// css-doodle builds its grid over a few frames and may rebuild it once; wait until the set of
// animations has stayed the same for five frames, so no new, unpaused animation appears later.
let last = -1, steady = 0;
for (let i = 0; i < 300 && steady < 5; i++) {
  await frames(1);
  const n = el.shadowRoot ? el.shadowRoot.getAnimations().length : 0;
  steady = n > 0 && n === last ? steady + 1 : 0;
  last = n;
}

// The doodle draws in its shadow root; document.getAnimations() does not reach into it.
const animations = () => [...document.getAnimations(), ...el.shadowRoot.getAnimations()];

if (animations().length === 0) throw new Error('the doodle has no CSS animation to seek');
const engine = defineEngine({id: 'css-doodle', width, height, fps: params.fps ?? 30, duration: params.duration ?? 4,
  seek(t) { for (const a of animations()) { a.pause(); a.currentTime = t * 1000; } }});
engine.seek(0);
window.__framemotion = {engine, element: '#stage', ready: true, animationCount: animations().length};
</script>
</body>
</html>

    <path d="M0 760 L1080 700 M0 830 L1080 770 M0 900 L1080 840 M0 970 L1080 910" fill="none" stroke="#5e241b" stroke-width="6"/>
    <rect x="160" y="520" width="110" height="200" fill="#6b4a3a"/><rect x="145" y="505" width="140" height="30" fill="#4e3429"/>
  </g>
  <g id="cat">
    <path d="M610 690 C600 600 640 540 690 530 L700 480 L725 515 L755 512 L780 478 L785 535 C820 560 830 610 815 690 Z" fill="#141418"/>
    <path d="M800 680 C880 690 900 620 870 590" fill="none" stroke="#141418" stroke-width="18" stroke-linecap="round"/>
    <circle cx="722" cy="560" r="7" fill="#d9e86a"/><circle cx="762" cy="560" r="7" fill="#d9e86a"/>

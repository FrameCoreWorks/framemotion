  <g id="sky"><rect x="0" y="0" width="1080" height="1080" fill="url(#sky)"/></g>
  <g id="moon-and-stars">
    <circle cx="790" cy="230" r="95" fill="#f6e7a8"/>
    <circle cx="760" cy="205" r="16" fill="#e6d38c"/><circle cx="820" cy="260" r="11" fill="#e6d38c"/>
    <path d="M200 160 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8z" fill="#fdf6d8"/>
    <path d="M420 110 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6z" fill="#fdf6d8"/>
    <path d="M560 300 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5z" fill="#fdf6d8"/>
  </g>
  <g id="city">
    <path d="M0 640 V520 H90 V470 H170 V560 H250 V430 H330 V590 H420 V500 H520 V610 H600 V480 H690 V560 H780 V450 H880 V580 H960 V500 H1080 V640 Z" fill="#1c2747"/>
    <rect x="270" y="470" width="20" height="26" fill="#f2c96b"/><rect x="800" y="490" width="20" height="26" fill="#f2c96b"/><rect x="620" y="520" width="18" height="24" fill="#f2c96b"/>
  </g>
  <g id="roof">
